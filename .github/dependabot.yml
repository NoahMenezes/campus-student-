version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 10
    groups:
      expo-sdk:
        patterns:
          - "expo*"
          - "@expo/*"
    labels:
      - "dependencies"
      - "security"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "daily"
      time: "09:00"
    groups:
      security-updates:
        patterns:
          - "*"
    labels:
      - "security"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"