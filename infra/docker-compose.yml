services:
  # =========================================================================
  # Default Profile: 3-Node Replica Set rs0 (localhost:27017-27019)
  # =========================================================================
  mongo1:
    image: mongo:7
    container_name: campus_mongo1
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all", "--port", "27017"]
    ports:
      - "27017:27017"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - mongo1_data:/data/db
    networks:
      rs0-net:
        aliases:
          - mongo1.localhost
    healthcheck:
      test: ["CMD", "mongosh", "--port", "27017", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  mongo2:
    image: mongo:7
    container_name: campus_mongo2
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all", "--port", "27018"]
    ports:
      - "27018:27018"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - mongo2_data:/data/db
    networks:
      rs0-net:
        aliases:
          - mongo2.localhost
    healthcheck:
      test: ["CMD", "mongosh", "--port", "27018", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  mongo3:
    image: mongo:7
    container_name: campus_mongo3
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all", "--port", "27019"]
    ports:
      - "27019:27019"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - mongo3_data:/data/db
    networks:
      rs0-net:
        aliases:
          - mongo3.localhost
    healthcheck:
      test: ["CMD", "mongosh", "--port", "27019", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  mongo-init:
    image: mongo:7
    container_name: campus_mongo_init
    depends_on:
      mongo1:
        condition: service_healthy
      mongo2:
        condition: service_healthy
      mongo3:
        condition: service_healthy
    networks:
      - rs0-net
    restart: "no"
    entrypoint:
      - bash
      - -c
      - |
        echo "Checking replica set rs0 status..."
        mongosh --host mongo1.localhost --port 27017 --quiet --eval '
          try {
            const st = rs.status();
            if (st.ok === 1) {
              print("Replica set rs0 already initialized.");
            }
          } catch (e) {
            print("Initializing replica set rs0...");
            const res = rs.initiate({
              _id: "rs0",
              members: [
                { _id: 0, host: "mongo1.localhost:27017" },
                { _id: 1, host: "mongo2.localhost:27018" },
                { _id: 2, host: "mongo3.localhost:27019" }
              ]
            });
            printjson(res);
          }
          for (let i = 0; i < 30; i++) {
            try {
              const s = rs.status();
              const primary = (s.members || []).find(m => m.stateStr === "PRIMARY");
              if (primary) {
                print("Primary elected: " + primary.name);
                quit(0);
              }
            } catch (err) {}
            sleep(1000);
          }
          print("Timed out waiting for primary election.");
          quit(1);
        '

  # =========================================================================
  # Sharded Profile ("sharded" = 3 nodes/RS; "light" / "sharded-light" = 1 node/RS)
  # Config Server RS (cfgrs) + 2 Shard RS (shard1rs, shard2rs) + mongos:27100
  # =========================================================================
  cfg1:
    image: mongo:7
    container_name: campus_cfg1
    profiles: ["sharded", "light", "sharded-light"]
    command: ["mongod", "--configsvr", "--replSet", "cfgrs", "--bind_ip_all", "--port", "27017", "--wiredTigerCacheSizeGB", "0.25"]
    volumes:
      - cfg1_data:/data/db
    networks:
      - sharded-net
    healthcheck:
      test: ["CMD", "mongosh", "--port", "27017", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  cfg2:
    image: mongo:7
    container_name: campus_cfg2
    profiles: ["sharded"]
    command: ["mongod", "--configsvr", "--replSet", "cfgrs", "--bind_ip_all", "--port", "27017", "--wiredTigerCacheSizeGB", "0.25"]
    volumes:
      - cfg2_data:/data/db
    networks:
      - sharded-net
    healthcheck:
      test: ["CMD", "mongosh", "--port", "27017", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  cfg3:
    image: mongo:7
    container_name: campus_cfg3
    profiles: ["sharded"]
    command: ["mongod", "--configsvr", "--replSet", "cfgrs", "--bind_ip_all", "--port", "27017", "--wiredTigerCacheSizeGB", "0.25"]
    volumes:
      - cfg3_data:/data/db
    networks:
      - sharded-net
    healthcheck:
      test: ["CMD", "mongosh", "--port", "27017", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  shard1a:
    image: mongo:7
    container_name: campus_shard1a
    profiles: ["sharded", "light", "sharded-light"]
    command: ["mongod", "--shardsvr", "--replSet", "shard1rs", "--bind_ip_all", "--port", "27017", "--wiredTigerCacheSizeGB", "0.25"]
    volumes:
      - shard1a_data:/data/db
    networks:
      - sharded-net
    healthcheck:
      test: ["CMD", "mongosh", "--port", "27017", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  shard1b:
    image: mongo:7
    container_name: campus_shard1b
    profiles: ["sharded"]
    command: ["mongod", "--shardsvr", "--replSet", "shard1rs", "--bind_ip_all", "--port", "27017", "--wiredTigerCacheSizeGB", "0.25"]
    volumes:
      - shard1b_data:/data/db
    networks:
      - sharded-net
    healthcheck:
      test: ["CMD", "mongosh", "--port", "27017", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  shard1c:
    image: mongo:7
    container_name: campus_shard1c
    profiles: ["sharded"]
    command: ["mongod", "--shardsvr", "--replSet", "shard1rs", "--bind_ip_all", "--port", "27017", "--wiredTigerCacheSizeGB", "0.25"]
    volumes:
      - shard1c_data:/data/db
    networks:
      - sharded-net
    healthcheck:
      test: ["CMD", "mongosh", "--port", "27017", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  shard2a:
    image: mongo:7
    container_name: campus_shard2a
    profiles: ["sharded", "light", "sharded-light"]
    command: ["mongod", "--shardsvr", "--replSet", "shard2rs", "--bind_ip_all", "--port", "27017", "--wiredTigerCacheSizeGB", "0.25"]
    volumes:
      - shard2a_data:/data/db
    networks:
      - sharded-net
    healthcheck:
      test: ["CMD", "mongosh", "--port", "27017", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  shard2b:
    image: mongo:7
    container_name: campus_shard2b
    profiles: ["sharded"]
    command: ["mongod", "--shardsvr", "--replSet", "shard2rs", "--bind_ip_all", "--port", "27017", "--wiredTigerCacheSizeGB", "0.25"]
    volumes:
      - shard2b_data:/data/db
    networks:
      - sharded-net
    healthcheck:
      test: ["CMD", "mongosh", "--port", "27017", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  shard2c:
    image: mongo:7
    container_name: campus_shard2c
    profiles: ["sharded"]
    command: ["mongod", "--shardsvr", "--replSet", "shard2rs", "--bind_ip_all", "--port", "27017", "--wiredTigerCacheSizeGB", "0.25"]
    volumes:
      - shard2c_data:/data/db
    networks:
      - sharded-net
    healthcheck:
      test: ["CMD", "mongosh", "--port", "27017", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  sharded-rs-init:
    image: mongo:7
    container_name: campus_sharded_rs_init
    profiles: ["sharded", "light", "sharded-light"]
    depends_on:
      cfg1:
        condition: service_healthy
      shard1a:
        condition: service_healthy
      shard2a:
        condition: service_healthy
    networks:
      - sharded-net
    volumes:
      - ./scripts:/scripts:ro
    restart: "no"
    entrypoint: ["bash", "/scripts/sharded-rs-init.sh"]

  mongos:
    image: mongo:7
    container_name: campus_mongos
    profiles: ["sharded", "light", "sharded-light"]
    depends_on:
      sharded-rs-init:
        condition: service_completed_successfully
    ports:
      - "27100:27100"
    networks:
      - sharded-net
    volumes:
      - ./scripts:/scripts:ro
    entrypoint: ["bash", "/scripts/mongos-entrypoint.sh"]
    healthcheck:
      test: ["CMD", "mongosh", "--port", "27100", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 5s
    restart: unless-stopped

  sharded-init:
    image: mongo:7
    container_name: campus_sharded_init
    profiles: ["sharded", "light", "sharded-light"]
    depends_on:
      mongos:
        condition: service_healthy
    networks:
      - sharded-net
    volumes:
      - ./scripts:/scripts:ro
    restart: "no"
    entrypoint: ["bash", "/scripts/sharded-init.sh"]

networks:
  rs0-net:
    driver: bridge
  sharded-net:
    driver: bridge

volumes:
  mongo1_data:
  mongo2_data:
  mongo3_data:
  cfg1_data:
  cfg2_data:
  cfg3_data:
  shard1a_data:
  shard1b_data:
  shard1c_data:
  shard2a_data:
  shard2b_data:
  shard2c_data:
